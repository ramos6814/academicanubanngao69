<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบริหารงานวิชาการ | โรงเรียนอนุบาลงาว (ภาณุนิยม)</title>
    
    <!-- ใส่ไอคอนเว็บ (Favicon) ของโรงเรียน -->
    <link rel="icon" href="https://img2.pic.in.th/pic/16424954472022011803440727_1-removebg-preview.png" type="image/png">
    
    <style>
        /* สั่งให้ Iframe แสดงผลเต็มหน้าจอโดยไม่มีขอบ ไม่มี Scrollbar นอก */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f172a; }
        iframe { border: none; width: 100%; height: 100%; }
        
        /* หน้าจอโหลดระหว่างรอ Google Apps Script ตอบสนอง */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            color: white; font-family: 'Prompt', sans-serif; transition: opacity 0.5s;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #60a5fa; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- หน้าจอโหลดดิ้งเริ่มต้น -->
    <div id="loader">
        <div class="spinner mb-4"></div>
        <p>กำลังเชื่อมต่อระบบวิชาการ...</p>
    </div>

    <!-- วางลิงก์ Google Apps Script ของคุณแทนที่ตัวหนังสือภาษาไทยด้านล่างนี้ -->
    <iframe src="https://script.google.com/macros/s/AKfycbx872RlMylrSGjZ_u0Ig7Yuf-665Be__mETRZRkS-Ac11dljDcGIjZ6yplWBLrneX2jyg/exec" onload="document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none', 500);"></iframe>

</body>
</html>
